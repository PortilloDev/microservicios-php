framework:
    messenger:
        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: { }
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            async_checkout_payment:
                dsn: '%env(string:MESSENGER_TRANSPORT_DSN)%'
                options:
                    vhost: '%env(string:MESSENGER_VHOST)%'
                    exchange:
                        name: '%env(string:MESSENGER_EXCHANGE_CHECKOUT)%'
                        type: direct
                    queues:
                        checkout_payment_queue:
                            binding_keys: [ checkout_payment_queue ]
            async_payment_events:
                dsn: '%env(string:MESSENGER_TRANSPORT_DSN)%'
                options:
                    vhost: '%env(string:MESSENGER_VHOST)%'
                    exchange:
                        name: '%env(string:MESSENGER_EXCHANGE_PAYMENT)%'
                        type: direct
            failed:
                dsn: 'doctrine://default?queue_name=failed'
        routing:
            'App\Messenger\Message\CheckoutRequestedMessage': async_checkout_payment
            'App\Messenger\Message\PaymentSucceededMessage': async_payment_events
            'App\Messenger\Message\PaymentFailedMessage': async_payment_events
