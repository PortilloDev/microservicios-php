framework:
    messenger:
        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: { }
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            async_payment_succeeded:
                dsn: '%env(string:MESSENGER_TRANSPORT_DSN)%'
                options:
                    vhost: '%env(string:MESSENGER_VHOST)%'
                    exchange:
                        name: '%env(string:MESSENGER_EXCHANGE_PAYMENT)%'
                        type: direct
                    queues:
                        esim_payment_succeeded_queue:
                            binding_keys: [ payment_succeeded ]
            async_esim_events:
                dsn: '%env(string:MESSENGER_TRANSPORT_DSN)%'
                options:
                    vhost: '%env(string:MESSENGER_VHOST)%'
                    exchange:
                        name: '%env(string:MESSENGER_EXCHANGE_ESIM)%'
                        type: direct
            failed:
                dsn: 'doctrine://default?queue_name=failed'
        routing:
            'App\Messenger\Message\PaymentSucceededMessage': async_payment_succeeded
            'App\Messenger\Message\EsimProvisionedMessage': async_esim_events
